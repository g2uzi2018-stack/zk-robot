exoskeleton:
  # 协议字段以厂商 qnbot-exoskeleton-SDK/qnbot_sdk_v1.2 为准。
  # C++ 运行时只负责实时读取 legacy 遥测；厂商 Python SDK 仍用于
  # QnTP 查询、校准、无线配置和触觉调试，见 tools/qnbot_vendor_probe.py。
  serial:
    # 推荐使用 udev 固定别名；设为 auto 则按下面的 VID:PID 自动枚举唯一设备。
    device: /dev/exoskeleton
    usb_vid: 0x0483
    usb_pid: 0x5740
    match_vid_only: false
    baudrate: 2000000
    # 与厂商 QnbotClient 的 read_timeout=0.02 对齐。
    poll_timeout_ms: 20
    reconnect_interval_ms: 1000

  telemetry:
    # 厂商 SDK 支持 51/91/131；当前 Qnbot Exo Plus 实机使用 131。
    # 若需要兼容多种固件，可改为 auto；实机控制建议先固定 131。
    frame_size: 131
    stale_timeout_ms: 100
