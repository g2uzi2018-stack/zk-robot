schema_version: 1

socketcan:
  # T170C 本体关节总线使用 Classic CAN 2.0，1 Mbps。
  bitrate: 1000000
  interface_regex: "^can[0-9]+$"

  # 自主驱动负责检查、配置并启动本体 CAN 接口。
  manage_linux_link: true

  # 接口准备完成后必须处于 UP，并校验实际波特率。
  require_interface_up: true
  validate_bitrate: true

  # Linux SocketCAN bus-off 自动恢复。
  restart_ms: 100

  # 原厂 stop 后约等待 100 ms 再重新配置。
  reconfigure_wait_ms: 100

  # CAN 接口 up 后等待设备状态稳定再开始扫描。
  startup_wait_ms: 100

  # 识别的是“本体四通道 USB-CAN 适配器”，
  # 不是固定 waist/head/arm 对应哪个 canX。
  # 实机 ID_SERIAL_SHORT 在两块 KCAN-USB_X4 上相同，不能用 serial 区分；
  # ID_PATH 是当前可获得的稳定物理端口属性。
  body_adapter:
    selector: id_path
    value: "platform-3610000.usb-usb-0:1.2.2:1.0"
    expected_channels: 4

discovery:
  enabled: true

  # 每次启动重新发现 logical bus -> canX，不缓存上次启动结果。
  cache_mapping: false

  # 只扫描 robot.yaml 中声明的 expected_node_ids，
  # 不扫描完整 11-bit CAN ID 空间。
  strategy: expected_node_ids

  # 发现阶段只允许使用 0x08 当前位置查询。
  response_timeout_ms: 50
  confirmations_required: 3
  max_attempts: 5

  # 真机本体必须完整发现，缺轴时拒绝进入正常控制状态。
  allow_partial_bus: false
  require_unique_bus_match: true

  # 傲意手使用独立协议，不参与本体 0x08 Discovery。
  discover_hands: false

receive:
  # 正式控制阶段由总线统一接收反馈，禁止多个 Motor 直接竞争 read()。
  centralized_receiver: true
  latest_feedback_cache: true
  timestamp_clock: monotonic

  # 只接收当前逻辑总线允许的 node ID。
  use_can_filters: true

  # 接收 Linux SocketCAN 错误帧，用于识别错误警告、错误被动、
  # 总线关闭和自动恢复；CAN 层只报告状态，不自动恢复运动。
  receive_error_frames: true

control:
  # 当前采用已有工程验证过的保守参考值，后续只根据实机证据调整。
  frequency_hz: 100
  inter_frame_gap_us: 50
  post_batch_feedback_wait_us: 200
  send_failure_threshold: 30

watchdog:
  # 连续 3 个控制周期没有新反馈即认为反馈失效。
  stale_feedback_cycles: 3
  reject_new_motion_on_stale_feedback: true
  enter_fault_on_stale_feedback: true
  enter_fault_on_bus_off: true

exclusive_control:
  # 防止两个控制进程同时向同一台机器人发送运动目标。
  enabled: true
  lock_file: "/run/lock/ti5-can-controller.lock"
  reject_second_controller: true
