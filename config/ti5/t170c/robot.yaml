# ============================================================
# 物理轴别名
# ============================================================

shared_axes:

  # 这里把多个业务语义明确收敛到同一个物理轴。node_id 2 只有一台实体
  # 电机，同时可能被 waist_pitch 和 Fold/腿链业务引用。
  # 驱动内部必须只创建一个 Motor 实例；两个业务线程不能分别直接发送
  # 目标，必须通过共享轴所有权仲裁控制。切换所有者时还应遵守
  # safety.yaml 中的保持当前位置和排他所有权规则。
  - physical_joint: fold_p3

    # 这些是业务层可申请的别名，不会创建额外电机；实际所有权仍由安全策略仲裁。
    semantic_aliases:
      - waist_pitch
      - fold_chain_p3
