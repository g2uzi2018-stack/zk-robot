schema_version: 1

robot:
  vendor: TI5
  model: T170C
  # 仅统计本体一体化关节，不包含左右傲意灵巧手控制器。
  body_motor_count: 22

# 这里定义的是机器人固定的“逻辑 CAN 分区”。
# Linux 的 can0/can1/... 会随设备枚举变化，因此绝不能写死在本文件中。
# 程序启动后通过 node ID 自动发现实际 Linux CAN 接口。
can_buses:
  - name: waist_fold
    protocol: ti5_joint
    required: true
    expected_node_ids: [1, 2, 3, 4, 5]

  - name: head
    protocol: ti5_joint
    required: true
    expected_node_ids: [30, 31, 32]

  - name: left_arm
    protocol: ti5_joint
    required: true
    expected_node_ids: [23, 24, 25, 26, 27, 28, 29]

  - name: right_arm
    protocol: ti5_joint
    required: true
    expected_node_ids: [16, 17, 18, 19, 20, 21, 22]

# T170C 本体当前均为双编码器。
# CAN position 是输出端位置，262144 count 对应输出轴一圈。
# 因此位置换算直接使用 raw_count * 2π / 262144，
# 不要因为 gear_ratio=101 再对位置除一次减速比。
encoder_defaults:
  type: dual
  position_reference: output
  counts_per_output_revolution: 262144
  gear_ratio: 101.0

joints:
  # Waist / Fold
  - name: waist_yaw
    physical_name: WAIST_Y
    bus: waist_fold
    motor:
      node_id: 1
      unit: radian

  # ID 2 是唯一一台实体电机，同时可能被 waist_pitch 和 Fold 业务引用。
  # 运行时只能创建一个 Motor，由上层做共享轴所有权仲裁。
  - name: fold_p3
    physical_name: Fold_P3
    bus: waist_fold
    motor:
      node_id: 2
      unit: radian

  - name: fold_p2
    physical_name: Fold_P2
    bus: waist_fold
    motor:
      node_id: 3
      unit: radian

  - name: fold_p1
    physical_name: Fold_P1
    bus: waist_fold
    motor:
      node_id: 4
      unit: radian

  - name: fold_r
    physical_name: Fold_R
    bus: waist_fold
    motor:
      node_id: 5
      unit: radian

  # Head
  - name: neck_yaw
    physical_name: NECK_Y
    bus: head
    motor:
      node_id: 30
      unit: radian

  - name: neck_pitch
    physical_name: NECK_P
    bus: head
    motor:
      node_id: 31
      unit: radian

  - name: neck_roll
    physical_name: NECK_R
    bus: head
    motor:
      node_id: 32
      unit: radian

  # Left Arm
  - name: left_shoulder_pitch
    physical_name: L_SHOULDER_P
    bus: left_arm
    motor:
      node_id: 23
      unit: radian

  - name: left_shoulder_roll
    physical_name: L_SHOULDER_R
    bus: left_arm
    motor:
      node_id: 24
      unit: radian

  - name: left_shoulder_yaw
    physical_name: L_SHOULDER_Y
    bus: left_arm
    motor:
      node_id: 25
      unit: radian

  - name: left_elbow_yaw
    physical_name: L_ELBOW_Y
    bus: left_arm
    motor:
      node_id: 26
      unit: radian

  - name: left_wrist_pitch
    physical_name: L_WRIST_P
    bus: left_arm
    motor:
      node_id: 27
      unit: radian

  - name: left_wrist_yaw
    physical_name: L_WRIST_Y
    bus: left_arm
    motor:
      node_id: 28
      unit: radian

  - name: left_wrist_roll
    physical_name: L_WRIST_R
    bus: left_arm
    motor:
      node_id: 29
      unit: radian

  # Right Arm
  - name: right_shoulder_pitch
    physical_name: R_SHOULDER_P
    bus: right_arm
    motor:
      node_id: 16
      unit: radian

  - name: right_shoulder_roll
    physical_name: R_SHOULDER_R
    bus: right_arm
    motor:
      node_id: 17
      unit: radian

  - name: right_shoulder_yaw
    physical_name: R_SHOULDER_Y
    bus: right_arm
    motor:
      node_id: 18
      unit: radian

  - name: right_elbow_yaw
    physical_name: R_ELBOW_Y
    bus: right_arm
    motor:
      node_id: 19
      unit: radian

  - name: right_wrist_pitch
    physical_name: R_WRIST_P
    bus: right_arm
    motor:
      node_id: 20
      unit: radian

  - name: right_wrist_yaw
    physical_name: R_WRIST_Y
    bus: right_arm
    motor:
      node_id: 21
      unit: radian

  - name: right_wrist_roll
    physical_name: R_WRIST_R
    bus: right_arm
    motor:
      node_id: 22
      unit: radian

# 业务别名只引用同一个实体关节，不能据此重复创建 Motor。
shared_axes:
  - physical_joint: fold_p3
    semantic_aliases:
      - waist_pitch
      - fold_chain_p3