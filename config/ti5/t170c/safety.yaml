schema_version: 1

startup:
  # Discovery 完成并获得有效当前位置之前，不允许进入运动控制状态。
  require_discovery_complete: true
  require_all_body_buses: true
  require_all_body_motors: true
  require_position_feedback: true

control_modes:
  # 第一版正式驱动只开放已经确认的 Position CSP。
  position_csp:
    supported: true
    allow_motion: true

  # 以下模式协议虽然已有部分信息，但安全参数和实机行为尚未完全确认。
  speed_csp:
    supported: false
    allow_motion: false

  current_csp:
    supported: false
    allow_motion: false

  position_non_csp:
    supported: false
    allow_motion: false

  pt:
    supported: false
    allow_motion: false

# 单位全部为 rad。
# 这些值来自当前 T170C 软件配置，只作为主机软件限位。
position_limits:
  waist_yaw:
    min: -1.570796327
    max: 1.570796327
    verified_on_robot: false

  # ID 2 同时服务 waist_pitch 和 Fold。
  # 第一版采用两套现有业务限位的保守交集 ±80°。
  fold_p3:
    min: -1.396263402
    max: 1.396263402
    verified_on_robot: false

  fold_p2:
    min: -2.757620218
    max: 0.0
    verified_on_robot: false

  fold_p1:
    min: -1.570796327
    max: 1.570796327
    verified_on_robot: false

  fold_r:
    min: -0.174532925
    max: 0.174532925
    verified_on_robot: false

  neck_yaw:
    min: -0.523598776
    max: 0.523598776
    verified_on_robot: false

  neck_pitch:
    min: -0.523598776
    max: 0.523598776
    verified_on_robot: false

  neck_roll:
    min: -0.523598776
    max: 0.523598776
    verified_on_robot: false

  left_shoulder_pitch:
    min: -2.792526803
    max: 0.872664626
    verified_on_robot: false

  left_shoulder_roll:
    # 2026-08-23 记录的自然下垂参考约为 -90.623°。
    # 这里只扩展主机软件限位；实际 CSP 目标仍须落在驱动器 0x1A/0x1B
    # 与本配置的交集内。
    min: -1.581678003
    max: 1.396263402
    verified_on_robot: false

  left_shoulder_yaw:
    min: -2.617993878
    max: 2.617993878
    verified_on_robot: false

  left_elbow_yaw:
    min: -2.268928028
    max: 0.610865238
    verified_on_robot: false

  left_wrist_pitch:
    min: -2.617993878
    max: 2.617993878
    verified_on_robot: false

  left_wrist_yaw:
    min: -0.698131701
    max: 0.436332313
    verified_on_robot: false

  left_wrist_roll:
    min: -2.268928028
    max: 0.575958653
    verified_on_robot: false

  right_shoulder_pitch:
    min: -0.872664626
    max: 2.792526803
    verified_on_robot: false

  right_shoulder_roll:
    min: -1.396263402
    # 2026-08-23 记录的自然下垂参考约为 +86.114°。
    # 这里只扩展主机软件限位；实际 CSP 目标仍须落在驱动器 0x1A/0x1B
    # 与本配置的交集内。
    max: 1.502965614
    verified_on_robot: false

  right_shoulder_yaw:
    min: -2.617993878
    max: 2.617993878
    verified_on_robot: false

  right_elbow_yaw:
    min: -0.610865238
    max: 2.268928028
    verified_on_robot: false

  right_wrist_pitch:
    min: -2.617993878
    max: 2.617993878
    verified_on_robot: false

  right_wrist_yaw:
    min: -0.436332313
    max: 0.698131701
    verified_on_robot: false

  right_wrist_roll:
    min: -0.575958653
    max: 2.268928028
    verified_on_robot: false

# 当前协议调查没有得到足够可靠的逐轴动态/电气安全参数。
# 保持 null，禁止为了通过配置校验而自行编造数值。
dynamic_limits:
  max_velocity_rad_s: null
  max_acceleration_rad_s2: null
  max_jerk_rad_s3: null
  max_step_per_cycle_rad: null
  verified_on_robot: false

electrical_limits:
  max_continuous_current_a: null
  max_peak_current_a: null
  peak_current_duration_ms: null
  verified_on_robot: false

temperature_limits:
  motor_warning_c: null
  motor_shutdown_c: null
  pcb_warning_c: null
  pcb_shutdown_c: null
  verified_on_robot: false

shared_axis_control:
  fold_p3:
    # ID 2 只有一个实体执行器，waist 和 fold 不能同时拥有运动目标。
    default_owner: none
    allowed_owners: [waist, fold]
    require_exclusive_owner: true

    # 所有权切换时先使用当前反馈作为新控制器首目标，
    # 避免切换瞬间产生位置跳变。
    hold_current_position_during_handover: true

fault_policy:
  # 故障必须确认原因后由上层显式恢复，禁止控制循环不断自动清故障。
  automatic_clear_fault: false
  stop_accepting_motion_on_fault: true
  preserve_unknown_fault_bits: true

shutdown_policy:
  # Fold/WAIST 的抱闸和去使能行为尚未完成安全验证，
  # 因此程序退出时不能无条件向所有节点发送 disable。
  automatic_disable: false
  brake_control_enabled: false

# 这些属于维护/标定命令，不进入普通运动控制 API。
firmware_parameter_writes:
  allow_can_id_change: false
  allow_bitrate_change: false
  allow_position_limit_write: false
  allow_speed_limit_write: false
  allow_current_limit_write: false
  allow_pid_write: false
  allow_encoder_calibration: false

  # 当前机器人零位已经保存在电机侧。
  # 禁止为了建立自主驱动再次写位置 offset / 零位。
  allow_zero_write: false

  allow_flash_save: false
  allow_factory_reset: false
  allow_bootloader_commands: false

disconnect_protection:
  # 0x59 帧格式已知，但掉线后的固件实际动作仍未完成验证。
  firmware_disconnect_protection_write: false
