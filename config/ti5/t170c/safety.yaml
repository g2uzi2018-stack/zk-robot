dynamic_limits:

  # 这些逐轴速度、加速度、jerk 和单周期步长的可靠数据尚未从协议调查和
  # 当前实体机器人验证中得到。null 表示“尚未确定”，不是 0、无限大或已关闭；
  # 禁止在此自行猜测数值，补齐前由代码拒绝依赖这些限制的运动。
  max_velocity_rad_s: null
  max_acceleration_rad_s2: null
  max_jerk_rad_s3: null
  max_step_per_cycle_rad: null

  # 当前实体机器人尚未验证这些限制。
  verified_on_robot: false

electrical_limits:

  # 协议资料缺少可按型号/节点可靠对应的连续电流、峰值电流和持续时间，
  # 因而全部保持 null；不能把少量日志中的电流值当成全机安全限流。
  max_continuous_current_a: null
  max_peak_current_a: null
  peak_current_duration_ms: null

  # 当前实体机器人尚未验证这些电气限制。
  verified_on_robot: false

temperature_limits:

  # 电机和 PCB 的告警/关断阈值仍缺少逐轴可靠来源，null 代表未知而不是关闭保护；
  # 在厂家参数或受控实机验证前禁止自行填入温度值。
  motor_warning_c: null
  motor_shutdown_c: null
  pcb_warning_c: null
  pcb_shutdown_c: null

  # 当前实体机器人尚未验证这些温度限制。
  verified_on_robot: false

shared_axis_control:

  fold_p3:

    # ID 2 的默认所有权为 none，启动时不允许 waist 或 fold 业务直接抢占它。
    default_owner: none

    # 只有列出的业务语义可以申请该轴；同一时刻只能有一个 owner。
    allowed_owners:
      - waist
      - fold

    # true 表示所有权是硬门槛，未获得唯一 owner 时拒绝发送运动目标。
    require_exclusive_owner: true

    # 切换控制来源时，旧控制器先停止改变目标；新控制器以当前反馈作为
    # 第一目标，再逐步改变目标，避免共享轴在交接瞬间跳变。
    hold_current_position_during_handover: true

fault_policy:

  # 故障清除必须由上层确认故障原因和恢复条件后显式执行；禁止在控制循环中
  # 无条件反复发送清故障命令，以免掩盖真实故障或在未恢复时重新运动。
  automatic_clear_fault: false

  # 进入故障后停止接收新的运动目标，保留故障上下文供人工/恢复状态机处理。
  stop_accepting_motion_on_fault: true

  # 未知故障位必须原样保留，避免解析器只认已知位而丢失厂家新增信息。
  preserve_unknown_fault_bits: true

shutdown_policy:

  # 当前 Fold/WAIST 的抱闸和去使能行为尚未完全验证；程序退出时不自动批量
  # disable，避免把承载轴置于未知状态或引发防坠风险。
  automatic_disable: false

  # 未反解并验证抱闸 raw 命令及机械到位反馈前，不由本程序控制抱闸。
  brake_control_enabled: false

firmware_parameter_writes:

  # 实时运动程序默认禁止写入固件参数；这些操作应由独立维护工具在停机、
  # 逐轴确认和可回滚的流程中执行，不能混入正常启动或控制循环。
  # 修改 CAN ID 可能导致节点失联或 ID 冲突，因此保持禁止。
  allow_can_id_change: false
  # 修改波特率可能立即造成整条物理分区通信不匹配，因此保持禁止。
  allow_bitrate_change: false

  # 固件位置/速度/电流保护值缺少逐型号逐轴可靠数据，不能由配置或业务程序写入。
  allow_position_limit_write: false
  allow_speed_limit_write: false
  allow_current_limit_write: false

  # PID 参数对不同执行器和负载敏感，现有资料存在冲突，禁止在线调参。
  allow_pid_write: false

  # 编码器校准和零点写入会改变位置坐标，必须使用 calibration.yaml 的实体标定流程；
  # 在未完成人工确认前禁止写入执行器。
  allow_encoder_calibration: false
  allow_zero_write: false

  # Flash 保存和恢复出厂会持久化或清除参数，可能造成不可逆配置变化，禁止默认执行。
  allow_flash_save: false
  # Factory Reset 会覆盖未知的厂家参数，不能作为故障恢复捷径。
  allow_factory_reset: false

  # Bootloader 命令属于固件维护，不属于实时运动控制路径。
  allow_bootloader_commands: false

disconnect_protection:

  # 0x59 的字节格式已知，但时间单位及超时后究竟保持、归零、失能还是抱闸
  # 仍未在当前实体机器人上验证；因此禁止自动写入，避免误触发未知动作。
  firmware_disconnect_protection_write: false
