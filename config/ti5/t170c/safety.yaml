# 这份文件是主机侧安全策略，不是机械硬限位、驱动器固件保护参数或安全继电器配置。
# 任何允许运动的条件都应在这里和代码中同时通过；未验证的信息保持关闭或 null，
# 不以“看起来合理”的默认值替代实机证据。
# schema_version 用于选择兼容的安全策略格式，不是固件版本或协议版本。
schema_version: 1

startup:

  # 默认启动在 discovery，只做接口/节点发现和反馈读取，不接受正式运动目标；
  # 即使 position_csp 在下面标为支持，也必须先通过本节的启动门槛。
  default_mode: discovery

  # 本体所有逻辑总线和实体电机都必须出现，不能缺轴启动后仍按完整机器人运行。
  require_all_body_buses: true
  require_all_body_motors: true

  # 未完成当前实体机器人的方向/零点标定时禁止运动；null 和 calibrated=false
  # 不能被程序解释成默认方向或零偏。
  require_calibration_for_motion: true
  # 没有可追溯的主机软件位置限位时禁止运动。这里的限位只用于软件钳位和
  # 目标拒绝，不等同于机械止挡或电机固件位置保护。
  require_position_limits_for_motion: true

control_modes:

  # 第一版只开放已有可靠协议证据支持的 Position CSP；其它模式的进入/退出、
  # 反馈布局或逐轴安全边界尚未完整验证，因此必须保持 supported/allow_motion=false。
  position_csp:
    # 使用 0x44 发送周期位置目标，并用 CSP 反馈确认实际状态。
    supported: true
    allow_motion: true

  speed_csp:
    # 协议命令虽有资料，但逐轴速度/加速度/电流约束和实机行为尚未补齐。
    supported: false
    allow_motion: false

  current_csp:
    # 未得到足够可靠的逐轴连续/峰值电流及持续时间数据，不能开放电流控制。
    supported: false
    allow_motion: false

  position_non_csp:
    # 非 CSP 位置模式的切换和反馈确认流程尚未作为统一安全路径验证。
    supported: false
    allow_motion: false

  pt:
    # PT 是独立的 8 字节位打包力位混合协议，边界和掉线行为未验证，当前禁用。
    supported: false
    allow_motion: false

position_limits:

  # 所有 min/max 统一使用 rad，且是主机侧软件位置限位；不能描述成机械硬限位、
  # 固件限位或完整无碰撞工作空间。source 记录限位数据的来源，便于追溯和复核；
  # verified_on_robot 只有在当前这台实体机器人逐轴验证后才能改为 true。
  # ============================================================
  # 腰部 / 折叠（Waist / Fold）
  # ============================================================

  waist_yaw:
    min: -1.570796327
    max: 1.570796327
    source: current_t170c_software_config
    verified_on_robot: false

  fold_p3:
    # ID 2 是共享物理轴：现有腰部语义为 ±90°，Fold 链语义为 ±80°。
    # 当前数值采用两者交集作为保守的软件限位；真正发送目标前仍必须由
    # shared_axis_control 的唯一所有者决定语义，不能让两套业务同时下发。
    min: -1.396263402
    max: 1.396263402
    source: conservative_intersection
    verified_on_robot: false

  fold_p2:
    min: -2.757620218
    max: 0.0
    source: current_t170c_software_config
    verified_on_robot: false

  fold_p1:
    min: -1.570796327
    max: 1.570796327
    source: current_t170c_software_config
    verified_on_robot: false

  fold_r:
