schema_version: 1

# 底盘使用的 SocketCAN 接口。
interface: vcan8

# 几何参数单位：米。
geometry:
  wheel_radius: 0.0985
  wheel_separation: 0.4044

limits:
  # 只作为上位机遥控的保守工程限制，单位分别为 m/s 和 rad/s。
  max_linear_velocity: 0.30
  max_angular_velocity: 0.80

motors:
  # 右轮和左轮必须使用不同的 CAN 节点 ID。
  right:
    node_id: 10
    unit: radian
    encoder:
      counts_per_motor_revolution: 4096
      gear_ratio: 1.0
      direction: 1
      zero_offset: 0.0

  left:
    node_id: 11
    unit: radian
    encoder:
      counts_per_motor_revolution: 4096
      gear_ratio: 1.0
      direction: 1
      zero_offset: 0.0
