# 右腕CAN总线配置

schema_version: 1

# CAN接口
interface: vcan5

# 总线上的关节
joints:

  # 右腕第1关节
  - name: arm_right_5_joint

    # 关节限制
    limits:
      # 最小位置(rad)
      min_position: -2.0243951023931953
      # 最大位置(rad)
      max_position: 2.0243951023931953
      # 最大速度(rad/s)
      max_velocity: 0.17453292519943295

    # 电机配置
    motor:
      # CAN节点ID
      node_id: 21
      # 单位
      # radian: 旋转关节
      # meter: 直线关节
      unit: radian

      # 编码器参数
      encoder:
        # 电机每转编码器计数
        counts_per_motor_revolution: 4096
        # 减速比
        gear_ratio: 1.0
        # 方向
        # 1 正向
        # -1 反向
        direction: 1
        # 零点偏移
        zero_offset: 0.0

  # 右腕第2关节
  - name: arm_right_6_joint

    # 关节限制
    limits:
      # 最小位置(rad)
      min_position: -1.5007963267948966
      # 最大位置(rad)
      max_position: 1.5007963267948966
      # 最大速度(rad/s)
      max_velocity: 0.17453292519943295

    # 电机配置
    motor:
      # CAN节点ID
      node_id: 22
      # 单位
      unit: radian

      # 编码器参数
      encoder:
        # 电机每转编码器计数
        counts_per_motor_revolution: 4096
        # 减速比
        gear_ratio: 1.0
        # 方向
        direction: 1
        # 零点偏移
        zero_offset: 0.0

  # 右腕第3关节
  - name: arm_right_7_joint

    # 关节限制
    limits:
      # 最小位置(rad)
      min_position: -2.0243951023931953
      # 最大位置(rad)
      max_position: 2.0243951023931953
      # 最大速度(rad/s)
      max_velocity: 0.17453292519943295

    # 电机配置
    motor:
      # CAN节点ID
      node_id: 23
      # 单位
      unit: radian

      # 编码器参数
      encoder:
        # 电机每转编码器计数
        counts_per_motor_revolution: 4096
        # 减速比
        gear_ratio: 1.0
        # 方向
        direction: 1
        # 零点偏移
        zero_offset: 0.0
